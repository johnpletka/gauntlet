# Gauntlet run configuration (FR-2.1). Scaffolded by `gauntlet init`.
#
# Agent profiles bind adapter + model + flags; pipeline steps reference them by
# name (`agent: builder`). Swapping builder/reviewer roles is a YAML edit here
# or a per-step override — no code change (FR-2.2). The engine builds the actual
# adapter via the entry-point registry (FR-2.4) and lints flags at load (§8).
#
# Per-user secrets (API keys) live in the environment / keychain, NEVER in this
# file (FR-1.4) — `gauntlet doctor` fails if a credential literal appears here.
# This file references models, not credentials.

base_branch: current
branch_prefix: "gauntlet/"
# Adopter layout: consolidate every gauntlet-owned file under .gauntlet/.
# `asset_root` is where the engine resolves pipelines/prompts/schemas/policy;
# `run_root` is where run output (manifests/transcripts) lands. Gauntlet's own
# source repo overrides these (`asset_root: "."`, `run_root: runs`) to keep its
# assets at the repo root.
asset_root: .gauntlet
run_root: .gauntlet/runs
test_command: "uv run pytest"

# On resume of a step killed mid-edit with a dirty worktree (FR-8.2):
#   park          -> stop for a human (default; nothing re-run over partial work)
#   reset_to_base -> back up the partial work to a ref, reset to base, re-run
interrupted_step: park

# Reviewer-mutation policy (FR-9.6): commit | revert | halt.
reviewer_mutation: commit

# --- Resilience & window knobs (harness-efficiency PRD) -----------------------
# Every knob below defaults to prior behavior; uncomment to opt in. See the
# README "Configuration" section for the full reference.
#
# resume_on_quota: notify     # notify (default) | auto — auto self-resumes a
#                             #   usage-limit park at the provider's hinted
#                             #   reset time (wants keep_awake or an external
#                             #   scheduler re-invoking `gauntlet resume`)
# keep_awake: true            # default; wraps the driver in `caffeinate -i`
#                             #   (darwin) — set false to allow host sleep
# resume_on_provider_unavailable: notify
#                             # notify (default) | auto — auto self-resumes a
#                             #   provider_unavailable park (dependency retries
#                             #   exhausted) at its recorded backoff/Retry-After
#                             #   deadline; same survival needs and shared
#                             #   max_auto_resume_attempts as resume_on_quota
# heartbeat_interval_s: 15    # driver heartbeat cadence (suspend detection)
# suspend_credit_cap_s: 43200 # max host-sleep time credited to a step deadline
# checkpoint_commits: keep    # keep | squash — builder `PN wip:` milestone
#                             #   commits; the reviewed range diff is identical
# triage_concurrency: 4      # bounded pool for per-finding triage calls
#
# Pre-step window admission (FR-10): estimate the next step from the
# machine-global usage ledger (~/.gauntlet/usage-ledger.jsonl; seed it with
# `gauntlet ledger backfill`) and warn — or park pre-step with `enforce: true` —
# when it won't fit the provider window. Absent block = admission off.
# providers:
#   anthropic:
#     window_hours: 5
#     window_budget: 1500000
#     budget_unit: tokens     # tokens | cost
#     enforce: false          # false = advisory warning; true = pre-step park
#     # fallback_estimate: 50000  # used while the ledger has no history

# Lightweight `gauntlet review` issue tracker (FR-6, optional). Uncomment to let
# `gauntlet review --issue ENG-1234` (and `--pr`'s linked-ticket auto-derive)
# fetch the originating problem statement. v1 supports only `linear`; the token
# lives in the ENVIRONMENT under the name below, NEVER in this file (§7).
# issue_tracker:
#   provider: linear            # v1: only "linear"; github / jira reserved
#   api_key_env: LINEAR_API_KEY # NAME of the env var holding the token, not the token
#   timeout_s: 10               # per-call tracker timeout (min 1)
#   # workspace: acme           # optional, provider-specific

# Where a `gauntlet review` run keeps its state (FR-8, optional). Default (unset)
# is out-of-repo so a review leaves ZERO git-status footprint. Set to an in-repo,
# gitignored path (e.g. .gauntlet/runs) to keep the review audit trail committable.
# review:
#   state_dir: null

agents:
  builder:
    adapter: claude-code
    # Short alias form — the only spelling claude 2.1.172 resolves; the long
    # `claude-opus-latest` is rejected with an in-band 404 (.gauntlet/pins.yaml).
    model: opus                        # passed via --model
    permission_mode: acceptEdits
    allowed_tools: [Bash, Read, Write, Edit, Grep, Glob]
    # claude loads the repo's PreToolUse hook only under project setting
    # sources; the engine-managed judge cannot gate the builder without it.
    base_flags: ["--setting-sources", "project"]
  reviewer:
    adapter: codex
    model: gpt-5.5
    sandbox: read-only        # pure review steps are read-only (FR-9.6)
  # Optional distinct-provider review panel member. To use Gemini for the
  # spec-coverage lens, uncomment this profile and change that panel member in
  # pipelines/standard.yaml from `reviewer` to `gemini`. Its scope is fully
  # inlined because the `api` adapter has no file access. `gauntlet doctor` will
  # then require GEMINI_API_KEY and probe the configured model before a run.
  # gemini:
  #   adapter: api
  #   model: gemini/gemini-2.5-pro
  # Behavioral verifier (pipeline-effectiveness FR-2.1/FR-2.5, P5; Q3 re-resolved
  # to claude-code). Executes the deliverable in a DISPOSABLE copy under the judge
  # PreToolUse hook (--setting-sources project); the verifier sub-step points the
  # judge repo-root at the copy so out-of-copy Read/Write/Edit/Bash paths are
  # DENIED, withholds network tools, and spawns from a secret-stripped env.
  # Enforcement is hook-level (the ratified v1 tradeoff). To review without a
  # behavioral verifier, drop `verifier:` from pipelines/standard.yaml's impl-cycle.
  verifier:
    adapter: claude-code
    model: opus
    permission_mode: acceptEdits
    allowed_tools: [Bash, Read, Grep, Glob, Edit, Write]
    base_flags: ["--setting-sources", "project"]
    # The verifier provisions the toolchain and RUNS the phase's tests, so its turn
    # needs more wall-clock than a quick agent turn (the adapter default is 600s).
    # Raise this as your suite grows; offline provisioning is wired in-engine (#69).
    step_timeout_s: 1800
  # Cheap-tier models for classification (FR-3.1): a small model for triage and
  # the judge LLM rung, a stronger model for severity-aware triage escalation.
  # Pinned to ApiAdapter models verified live via LiteLLM (.gauntlet/pins.yaml):
  # `claude-haiku-latest` did not resolve, so the cheap tier is OpenAI here.
  triage:
    adapter: api
    model: gpt-5-mini
  escalation:
    adapter: api
    model: gpt-5
  judge_llm:
    adapter: api
    model: gpt-5-mini
    # The classifier uses this profile value (validated against the canonical
    # effort enum). Models that reject `minimal` can select `low` here; doctor
    # exercises the exact classifier path before a run.
    effort: minimal
  # Cheap profile for MECHANICAL emissions (FR-6.3): commit-message drafting and
  # resume-disposition emission run here, not on the builder, so the builder's
  # constrained provider window is spent on building. Effort *value* is Q2 (out
  # of P7 scope); this is the profile *assignment* only.
  mechanic:
    adapter: api
    model: gpt-5-mini

# Per-agent commit identities (FR-9.7) so git log distinguishes who authored what.
identities:
  builder:
    name: "Gauntlet Builder (claude)"
    email: "builder@gauntlet.local"
  reviewer:
    name: "Gauntlet Reviewer (codex)"
    email: "reviewer@gauntlet.local"
  verifier:
    name: "Gauntlet Verifier (claude)"
    email: "verifier@gauntlet.local"
  triage:
    name: "Gauntlet Triage"
    email: "triage@gauntlet.local"
